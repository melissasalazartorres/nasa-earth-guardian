<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | NASA Earth Guardian</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f5f2;
            color: #103d30;
        }

        /* BARRA SUPERIOR */
        .navbar {
            background: linear-gradient(135deg, #092e25, #126b49);
            color: white;
            padding: 16px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .btn-nav {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-nav:hover {
            background-color: #087c50;
        }

        .btn-logout:hover {
            background-color: #d9534f;
        }

        /* CONTENEDOR PRINCIPAL */
        .dashboard-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .header-titulo {
            margin-bottom: 25px;
        }

        .header-titulo h1 {
            font-size: 28px;
            color: #103d30;
        }

        .header-titulo p {
            color: #556b61;
            font-size: 14px;
            margin-top: 5px;
        }

        /* TARJETAS DE ESTADÍSTICAS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px 26px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border-left: 5px solid #159b64;
        }

        .stat-card.critica {
            border-left-color: #d9534f;
        }

        .stat-card span {
            font-size: 13px;
            font-weight: bold;
            color: #68766e;
            text-transform: uppercase;
        }

        .stat-card h2 {
            font-size: 34px;
            margin-top: 8px;
            color: #103d30;
        }

        .stat-card.critica h2 {
            color: #d9534f;
        }

        /* SECCIÓN PRINCIPAL: FORMULARIO + TABLA */
        .contenido-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
            align-items: start;
        }

        .panel-caja {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
        }

        .panel-caja h3 {
            font-size: 18px;
            margin-bottom: 18px;
            color: #103d30;
            border-bottom: 2px solid #eef8f4;
            padding-bottom: 10px;
        }

        /* FORMULARIO */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #344b40;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9e4dd;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fcfa;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #159b64;
        }

        .btn-registrar {
            width: 100%;
            padding: 12px;
            background-color: #159b64;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-registrar:hover {
            background-color: #10794d;
        }

        /* TABLA DE ALERTAS */
        .tabla-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background-color: #f4f9f6;
            color: #103d30;
            text-align: left;
            padding: 12px 15px;
            font-weight: bold;
            border-bottom: 2px solid #e1ece6;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #eef3f0;
            color: #333;
        }

        tr:hover {
            background-color: #fafdfb;
        }

        /* ETIQUETAS DE GRAVEDAD */
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-alta {
            background-color: #fdecea;
            color: #b71c1c;
        }

        .badge-media {
            background-color: #fff8e1;
            color: #b28704;
        }

        .badge-baja {
            background-color: #e8f5e9;
            color: #1b5e20;
        }

        .btn-eliminar {
            background: none;
            border: none;
            color: #d9534f;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-eliminar:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .contenido-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="navbar-brand">
            <span>🌎</span>
            <span>NASA EARTH GUARDIAN</span>
        </div>

        <div class="navbar-user">
            <span>Hola, <strong>Guardián</strong></span>
            <a href="index.html" class="btn-nav">Inicio</a>
            <a href="login.html" class="btn-nav btn-logout">Cerrar sesión</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="dashboard-container">

        <div class="header-titulo">
            <h1>Panel de Monitoreo Ambiental</h1>
            <p>Registra, supervisa y gestiona eventos ambientales en tiempo real.</p>
        </div>

        <!-- TARJETAS DE RESUMEN -->
        <div class="stats-grid">
            <div class="stat-card">
                <span>Total de alertas</span>
                <h2 id="contador-total">3</h2>
            </div>

            <div class="stat-card critica">
                <span>Alertas críticas</span>
                <h2 id="contador-criticas">1</h2>
            </div>

            <div class="stat-card">
                <span>Estado del sistema</span>
                <h2 style="font-size: 24px; color: #159b64; margin-top: 14px;">● Activo</h2>
            </div>
        </div>

        <!-- CUADRÍCULA DE FORMULARIO Y TABLA -->
        <div class="contenido-grid">

            <!-- COLUMNA IZQUIERDA: NUEVA ALERTA -->
            <div class="panel-caja">
                <h3>Registrar nueva alerta</h3>

                <form id="form-alerta">
                    <div class="form-group">
                        <label for="titulo">Título del evento</label>
                        <input type="text" id="titulo" placeholder="Ej. Incendio forestal en reserva" required>
                    </div>

                    <div class="form-group">
                        <label for="ubicacion">Ubicación / Zona</label>
                        <input type="text" id="ubicacion" placeholder="Ej. Sector Norte, Km 14" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría ambiental</label>
                        <select id="categoria" required>
                            <option value="Incendio Forestal">Incendio Forestal</option>
                            <option value="Contaminación de Agua">Contaminación de Agua</option>
                            <option value="Deforestación">Deforestación</option>
                            <option value="Calidad del Aire">Calidad del Aire</option>
                            <option value="Otro">Otro evento</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="gravedad">Nivel de gravedad</label>
                        <select id="gravedad" required>
                            <option value="Alta">Alta (Crítica)</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción breve</label>
                        <textarea id="descripcion" rows="3" placeholder="Detalles observados..."></textarea>
                    </div>

                    <button type="submit" class="btn-registrar">+ Publicar alerta</button>
                </form>
            </div>
